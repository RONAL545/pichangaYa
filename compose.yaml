services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: pichanga
      POSTGRES_PASSWORD: pichanga
      POSTGRES_DB: pichanga
    ports:
      - "127.0.0.1:${DB_PORT:-55434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pichanga -d pichanga"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
